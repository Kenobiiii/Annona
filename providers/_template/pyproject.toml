[project]
name = "annona-provider-example"
version = "0.1.0"
description = "Example Annona supermarket provider (template)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = ["annona-providers", "httpx>=0.28,<1"]

[project.optional-dependencies]
testing = ["annona-providers[testing]"]

# The entry point name must equal ExampleProvider.info.id
[project.entry-points."annona.providers"]
example = "annona_provider_example:ExampleProvider"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annona_provider_example"]
