[project]
name = "annona-providers"
version = "0.0.0"
description = "Supermarket provider interface, registry and plugins."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "annona-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annona_providers"]

[tool.uv.sources]
annona-core = { workspace = true }
