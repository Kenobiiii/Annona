[project]
name = "annona-providers"
version = "0.1.0"
description = "Supermarket provider interface, registry and plugins."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "annona-core",
    "httpx>=0.28,<1",
    "mercapy>=2.4,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annona_providers"]

[tool.uv.sources]
annona-core = { workspace = true }

[project.optional-dependencies]
testing = ["pytest>=8.4"]

[project.entry-points."annona.providers"]
open_prices = "annona_providers.open_prices:OpenPricesProvider"
mercadona = "annona_providers.mercadona:MercadonaProvider"
